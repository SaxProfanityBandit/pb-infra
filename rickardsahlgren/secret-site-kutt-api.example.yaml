# Kutt → CV gate (gateway calls Kutt's REST API; no extra app).
# 1. In Kutt: Settings → Generate API key
# 2. cp this file → secret-site-kutt-api.yaml, paste key, kubectl apply -f …
# 3. kubectl rollout restart deployment/site -n rickardsahlgren
apiVersion: v1
kind: Secret
metadata:
  name: site-kutt-api
  namespace: rickardsahlgren
type: Opaque
stringData:
  api_key: replace-with-kutt-api-key
