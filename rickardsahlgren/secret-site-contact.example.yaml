# Contact form: SMTP → me@sax.lgbt + Matrix via Matrix Hookshot inbound webhook URL.
# 1. Deploy Hookshot (pb-infra matrix/) and register appservice on Synapse — see pb-infra-docs
# 2. In Element: invite @hookshot:chat.sax.lgbt, create webhook (!hookshot webhook contact)
# 3. Paste the full webhook URL below (https://hooks.sax.lgbt/webhook/…)
# 4. Stalwart app password for SMTP submission (user sax)
# 5. cp → secret-site-contact.yaml, kubectl apply -f …
apiVersion: v1
kind: Secret
metadata:
  name: site-contact
  namespace: rickardsahlgren
type: Opaque
stringData:
  smtp_user: sax
  smtp_password: replace-with-stalwart-app-password
  hookshot_webhook_url: https://hooks.sax.lgbt/webhook/replace-with-your-token
