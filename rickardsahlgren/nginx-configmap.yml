apiVersion: v1
kind: ConfigMap
metadata:
  name: site-nginx
  namespace: rickardsahlgren
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 256;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        access_log    /dev/stdout;
        sendfile      on;

        server {
            listen 8080;
            server_name _;
            root /srv/public;
            index index.html;

            location /cv/ {
                return 404;
            }

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
