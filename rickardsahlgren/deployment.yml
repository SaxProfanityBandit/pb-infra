apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: rickardsahlgren
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rickardsahlgren-site
  template:
    metadata:
      labels:
        app: rickardsahlgren-site
    spec:
      initContainers:
        - name: build-gateway
          image: docker.io/library/golang:1.23-alpine
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /tmp/build
              cp /src/*.go /tmp/build/
              printf 'module resume-gateway\ngo 1.23\n' > /tmp/build/go.mod
              cd /tmp/build && go build -ldflags="-s -w" -o /gateway/resume-gateway .
          volumeMounts:
            - name: gateway-src
              mountPath: /src
            - name: gateway-bin
              mountPath: /gateway
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
      containers:
        - name: gateway
          image: docker.io/library/alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if command -v chromium >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1; then
                echo "chromium already present"
              else
                apk add --no-cache chromium nss freetype harfbuzz ca-certificates
              fi
              exec /gateway/resume-gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RESUME_LINK_KEY
              valueFrom:
                secretKeyRef:
                  name: site-link-signing
                  key: key
            - name: PUBLIC_ROOT
              value: /srv/public
            - name: PRIVATE_CV_ROOT
              value: /srv/private/cv
            - name: LISTEN
              value: ":8080"
            - name: GATEWAY_REV
              value: "contact-smtp-hookshot-4"
            - name: CONTACT_SMTP_HOST
              value: "stalwart-mailserver.mailserver.svc.cluster.local:587"
            - name: CONTACT_SMTP_TLS_INSECURE
              value: "1"
            - name: CONTACT_MAIL_TO
              value: "me@sax.lgbt"
            - name: CONTACT_MAIL_FROM
              value: "me@sax.lgbt"
            - name: CONTACT_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: site-contact
                  key: smtp_user
                  optional: true
            - name: CONTACT_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: site-contact
                  key: smtp_password
                  optional: true
            - name: HOOKSHOT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: site-contact
                  key: hookshot_webhook_url
                  optional: true
            - name: HOOKSHOT_WEBHOOK_INTERNAL_URL
              valueFrom:
                secretKeyRef:
                  name: site-contact
                  key: hookshot_webhook_internal_url
                  optional: true
            - name: SITE_PUBLIC_URL
              value: "https://rickardsahlgren.name"
            - name: KUTT_API_URL
              value: "http://kutt.kutt.svc.cluster.local"
            - name: KUTT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: site-kutt-api
                  key: api_key
                  optional: true
          volumeMounts:
            - name: gateway-bin
              mountPath: /gateway
              readOnly: true
            - name: content
              mountPath: /srv
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: gateway-src
          configMap:
            name: site-gateway-src
        - name: gateway-bin
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: site-content
