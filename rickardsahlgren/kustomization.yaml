apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yml
  - pvc.yml
  - deployment.yml
  - service.yml
  - ingress_site.yml

configMapGenerator:
  - name: site-gateway-src
    namespace: rickardsahlgren
    files:
      - main.go=gateway/main.go
      - contact.go=gateway/contact.go

generatorOptions:
  disableNameSuffixHash: true
