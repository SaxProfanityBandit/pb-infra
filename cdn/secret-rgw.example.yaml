apiVersion: v1
kind: Secret
metadata:
  name: cdn-rgw
  namespace: cdn
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_CDN_READ_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: REPLACE_CDN_READ_SECRET_KEY
  AWS_SIGS_VERSION: "4"
  S3_BUCKET_NAME: sax-stack-media
  S3_REGION: us-east-1
  S3_SERVER: rgw.ctrl-c.liu.se
  S3_SERVER_PORT: "80"
  S3_SERVER_PROTO: http
  S3_STYLE: path
  ALLOW_DIRECTORY_LIST: "false"
  PROVIDE_INDEX_PAGE: "false"
  PROXY_CACHE_VALID_OK: "5m"
  PROXY_CACHE_VALID_NOTFOUND: "1m"
  PROXY_CACHE_VALID_FORBIDDEN: "30s"
