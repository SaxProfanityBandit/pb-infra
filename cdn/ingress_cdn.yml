apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: cdn-sax
  namespace: cdn
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cdn.sax.lgbt`) && (PathPrefix(`/public`) || PathPrefix(`/matrix`))
      services:
        - name: cdn-edge
          kind: Service
          port: http
  tls:
    certResolver: cert-resolver
    domains:
      - main: cdn.sax.lgbt
