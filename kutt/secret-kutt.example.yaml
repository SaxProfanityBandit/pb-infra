apiVersion: v1
kind: Secret
metadata:
  name: kutt-config
  namespace: kutt
type: Opaque
stringData:
  SITE_NAME: Rickard links
  DEFAULT_DOMAIN: links.rickardsahlgren.name
  # Optional second short-link host: A record links.sax.lgbt → LB, then add domain in Kutt admin (Custom domains).
  JWT_SECRET: replace-with-long-random-string
  DB_CLIENT: better-sqlite3
  DB_FILENAME: /var/lib/kutt/data.sqlite
  TRUST_PROXY: "true"
  DISALLOW_ANONYMOUS_LINKS: "true"
  # First visit: set false, sign up at https://links.rickardsahlgren.name/, then true
  DISALLOW_REGISTRATION: "false"
  #
  # CV access (manage everything in Kutt UI):
  # - Custom URL: e.g. cv-acme
  # - Target: https://rickardsahlgren.name/access/kutt/cv-acme  (slug must match)
  # - Set expiry / optional password in Kutt; share https://links.rickardsahlgren.name/cv-acme
  # Gateway needs your Kutt API key: rickardsahlgren/secret-site-kutt-api.example.yaml
