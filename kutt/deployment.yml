apiVersion: apps/v1
kind: Deployment
metadata:
  name: kutt
  namespace: kutt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kutt
  template:
    metadata:
      labels:
        app: kutt
    spec:
      containers:
        - name: kutt
          image: kutt/kutt:v3.2.6
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: kutt-config
          volumeMounts:
            - name: data
              mountPath: /var/lib/kutt
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 512Mi
            requests:
              cpu: 50m
              memory: 192Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kutt-data
