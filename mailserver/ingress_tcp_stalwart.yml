---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: stalwart-imaps
  namespace: mailserver
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - imap
  routes:
    - match: HostSNI(`mail.sax.lgbt`)
      services:
        - name: stalwart-mailserver
          port: imap
  tls:
    certResolver: cert-resolver
    domains:
      - main: mail.sax.lgbt
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: stalwart-smtp
  namespace: mailserver
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - smtp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: stalwart-mailserver
          port: smtp
