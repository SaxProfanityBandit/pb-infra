apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart-mailserver
  namespace: mailserver
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: stalwart-mail
      version: "~1.0.6"
      sourceRef:
        kind: HelmRepository
        name: stalwart-charts
        namespace: mailserver
  values:
    replicaCount: 0

    image:
      registry: ghcr.io
      repository: stalwartlabs/stalwart
      tag: "v0.15.5"

    ingress:
      enabled: false

    traefik:
      enabled: false

    certificate:
      certmanager:
        enabled: false

    nats:
      enabled: false

    backup:
      enabled: false

    config:
      cluster:
        node-id: "0"
      server:
        hostname: mail.sax.lgbt
        allowed-ip:
          "10.42.0.0/16": ""
          "10.254.0.0/16": ""

    persistence:
      enabled: true
      size: 10Gi

    resources:
      limits:
        ephemeral-storage: 2Gi
      requests:
        ephemeral-storage: 512Mi

  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: stalwart-mailserver
            patch: |
              - op: remove
                path: /spec/ordinals
              - op: add
                path: /spec/serviceName
                value: stalwart-mailserver
