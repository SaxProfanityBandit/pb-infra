apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: foundryvtt
  namespace: foundryvtt
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`foundry.sax.lgbt`)
    middlewares:
      - name: default-headers
        namespace: network
    services:
      - name: foundryvtt-foundry-vtt
        kind: Service
        port: http
        serversTransport: foundry-long
  tls:
    certResolver: cert-resolver
    domains:
      - main: foundry.sax.lgbt
