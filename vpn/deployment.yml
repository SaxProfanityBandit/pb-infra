apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: vpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
        - name: wireguard
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache wireguard-tools iptables iproute2 dnsmasq
              wg-quick up /etc/wireguard/wg0.conf
              dnsmasq -C /etc/dnsmasq/dnsmasq.conf &
              trap 'kill $(pidof dnsmasq) 2>/dev/null; wg-quick down /etc/wireguard/wg0.conf' EXIT
              sleep infinity
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: wg-config
              mountPath: /etc/wireguard/wg0.conf
              subPath: wg0.conf
              readOnly: true
            - name: dnsmasq
              mountPath: /etc/dnsmasq
              readOnly: true
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
      volumes:
        - name: wg-config
          secret:
            secretName: wireguard-config
        - name: dnsmasq
          configMap:
            name: wireguard-dnsmasq
