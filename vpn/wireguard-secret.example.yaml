apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: vpn
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    Address = 10.200.0.1/24
    ListenPort = 51820
    PrivateKey = SERVER_PRIVATE_KEY_REPLACE
    PostUp = sysctl -w net.ipv4.ip_forward=1; iptables -t nat -A POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
    PostDown = iptables -t nat -D POSTROUTING -s 10.200.0.0/24 -o eth0 -j MASQUERADE; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT

    [Peer]
    PublicKey = CLIENT_PUBLIC_KEY_REPLACE
    AllowedIPs = 10.200.0.2/32
