apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: traefik
  namespace: network
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: '~21'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: network
  values:
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
    certResolvers:
      cert-resolver:
        email: rsahlgren@gmail.com
        httpChallenge:
          entryPoint: web
        storage: /data/acme.json
    globalArguments:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"
    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
    deployment:
      enabled: true
      replicas: 1
      initContainers:
        - name: volume-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              touch /data/acme.json
              chown -v 65532:65532 /data/acme.json
              chmod -v 600 /data/acme.json
          securityContext:
            runAsNonRoot: false
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
      web:
        redirectTo: websecure
      websecure:
        tls:
          enabled: true
      imap:
        port: 10993
        expose: true
        exposedPort: 993
        protocol: TCP
      submission:
        port: 10587
        expose: true
        exposedPort: 587
        protocol: TCP
      submissions:
        port: 10465
        expose: true
        exposedPort: 465
        protocol: TCP
      smtp:
        port: 10025
        expose: true
        exposedPort: 25
        protocol: TCP
      sftpgo:
        port: 12022
        expose: true
        exposedPort: 22
        protocol: TCP
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
    rbac:
      enabled: true
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 130.236.253.195
        allocateLoadBalancerNodePorts: false