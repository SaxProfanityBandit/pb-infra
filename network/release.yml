apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: network
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      version: "27.0.2"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: network
  timeout: 15m
  values:
    image:
      tag: v2.11.60
      pullPolicy: IfNotPresent
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
    certResolvers:
      cert-resolver:
        email: rsahlgren@gmail.com
        httpChallenge:
          entryPoint: web
        storage: /data/acme.json
    globalArguments:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"
    api:
      dashboard: true
      insecure: false
    deployment:
      enabled: true
      replicas: 1
      initContainers:
        - name: volume-permissions
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              touch /data/acme.json
              chown -v 65532:65532 /data/acme.json
              chmod -v 600 /data/acme.json
          securityContext:
            runAsNonRoot: false
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
      web:
        redirectTo:
          port: websecure
      websecure:
        tls:
          enabled: true
      imap:
        port: 10993
        expose:
          default: true
        exposedPort: 993
        protocol: TCP
      submission:
        port: 10587
        expose:
          default: true
        exposedPort: 587
        protocol: TCP
      submissions:
        port: 10465
        expose:
          default: true
        exposedPort: 465
        protocol: TCP
      smtp:
        port: 10025
        expose:
          default: true
        exposedPort: 25
        protocol: TCP
      sftpgo:
        port: 12022
        expose:
          default: true
        exposedPort: 22
        protocol: TCP
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-external
        publishedService:
          enabled: false
    rbac:
      enabled: true
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 130.236.253.195
        allocateLoadBalancerNodePorts: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: traefik
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate