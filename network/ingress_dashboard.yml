apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: network
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`traefik.sax.lgbt`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    middlewares:
      - name: default-headers
        namespace: network
      - name: traefik-dashboard-basicauth
        namespace: network
    services:
      - name: api@internal
        kind: TraefikService
  tls:
    certResolver: cert-resolver
    domains:
      - main: traefik.sax.lgbt
