apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - network
  - foundryvtt
  - mailserver
  - sftpgo
  - matrix
  - rickardsahlgren
  - kutt

configMapGenerator:
  - name: site-gateway-src
    namespace: rickardsahlgren
    files:
      - main.go=gateway/main.go
      - contact.go=gateway/contact.go
      - util.go=gateway/util.go
      - signing.go=gateway/signing.go
      - kutt.go=gateway/kutt.go
  - name: matrix-gateway-src
    namespace: matrix
    files:
      - main.go=gateway/registration_main.go
      - contact.go=gateway/contact.go
      - util.go=gateway/util.go
      - signing.go=gateway/signing.go
      - kutt.go=gateway/kutt.go
      - matrix_join_gate.go=gateway/matrix_join_gate.go
      - matrix_approve.go=gateway/matrix_approve.go
      - matrix_request.go=gateway/matrix_request.go
      - matrix_request_store.go=gateway/matrix_request_store.go

generatorOptions:
  disableNameSuffixHash: true
