apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg
  namespace: sftpgo
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: postgresql
      version: "16.7.24"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: sftpgo
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      # Pin live PG 18.6 (was `latest`); digest matches cluster before Block B.
      tag: 18.6.0-debian-12-r6
      digest: sha256:6431f1bfa8f0aca2976669a5f84d4233b4f4e6e26a035b08d0782aea733c5518
    architecture: standalone
    auth:
      username: sftpgo
      database: sftpgo
      existingSecret: sftpgo-db
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      persistence:
        enabled: true
        size: 10Gi
        storageClass: 'rook-ceph'
