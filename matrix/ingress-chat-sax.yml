apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: synapse-chat
  namespace: matrix
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`chat.sax.lgbt`) && (PathPrefix(`/_matrix/media`) || PathPrefix(`/_matrix/client/v1/media`) || PathPrefix(`/_matrix/federation/v1/media`))
      priority: 110
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: mmr
          kind: Service
          port: 8000
    - kind: Rule
      match: Host(`chat.sax.lgbt`) && PathPrefix(`/.well-known/`)
      priority: 100
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: synapse-wellknown-lighttpd
          kind: Service
          port: 80
    - kind: Rule
      match: Host(`chat.sax.lgbt`) && PathPrefix(`/matrix/request`)
      priority: 95
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: registration-gateway
          kind: Service
          port: http
    - kind: Rule
      match: Host(`chat.sax.lgbt`) && PathPrefix(`/join/via/kutt/`)
      priority: 94
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: registration-gateway
          kind: Service
          port: http
    - kind: Rule
      match: Host(`chat.sax.lgbt`) && (PathPrefix(`/join`) || Path(`/join`))
      priority: 90
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: chat-join-landing
          kind: Service
          port: http
    - kind: Rule
      match: Host(`chat.sax.lgbt`)
      middlewares:
        - name: default-headers
          namespace: network
      services:
        - name: synapse-matrix-synapse
          kind: Service
          port: http
  tls:
    certResolver: cert-resolver
    domains:
      - main: chat.sax.lgbt
