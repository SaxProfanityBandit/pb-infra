apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hookshot
  namespace: matrix
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: hookshot
      version: "0.1.16"
      sourceRef:
        kind: HelmRepository
        name: matrix-hookshot
        namespace: matrix
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/matrix-org/matrix-hookshot
      tag: "7.5.0"
    hookshot:
      existingConfigMap: hookshot-config
      config: {}
    service:
      type: ClusterIP
    ingress:
      webhook:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hookshot
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: hookshot-crypto
                  persistentVolumeClaim:
                    claimName: hookshot-crypto
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: hookshot-crypto
                  mountPath: /crypto
