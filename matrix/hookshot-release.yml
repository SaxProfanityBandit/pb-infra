apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hookshot
  namespace: matrix
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: hookshot
      version: "0.1.13"
      sourceRef:
        kind: HelmRepository
        name: matrix-hookshot
        namespace: matrix
  values:
    replicaCount: 1
    hookshot:
      existingConfigMap: hookshot-config
      config: {}
    service:
      type: ClusterIP
    ingress:
      webhook:
        enabled: false
