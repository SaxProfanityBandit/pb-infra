apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-join-landing
  template:
    metadata:
      labels:
        app: chat-join-landing
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html-wiring
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: html-content
              mountPath: /usr/share/nginx/html/forbidden.html
              subPath: forbidden.html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html-wiring
          configMap:
            name: chat-join-landing-wiring
        - name: html-content
          configMap:
            name: chat-join-landing-content
            optional: true
        - name: nginx-conf
          configMap:
            name: chat-join-landing-wiring
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  selector:
    app: chat-join-landing
  ports:
    - name: http
      port: 80
      targetPort: http
