apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-join-landing
  namespace: matrix
data:
  default.conf: |
    server {
      listen 80;
      location = /join/gate {
        internal;
        proxy_pass http://registration-gateway.matrix.svc.cluster.local/join/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # auth_request subrequest URI is /join/gate; pass the browser URI (token, rid, wsig).
        proxy_set_header X-Original-URI $join_client_uri;
      }

      location /join {
        set $join_client_uri $request_uri;
        auth_request /join/gate;
        error_page 403 = @join_forbidden;
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
      }

      location @join_forbidden {
        default_type text/html;
        return 403 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chat.sax.lgbt</title></head><body style="font-family:system-ui,sans-serif;max-width:28rem;margin:2rem auto;padding:0 1rem;line-height:1.5"><h1>Invite link required</h1><p>Registration on <strong>chat.sax.lgbt</strong> is not open at this URL. Use the short link you were given (it redirects here after a check).</p><p>If you lost the link, contact the person who invited you.</p></body></html>';
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Register on chat.sax.lgbt</title>
      <style>
        :root { --fg:#1a1a1a; --muted:#555; --bg:#f6f6f6; --ok:#0a6; --err:#b00; }
        body{font-family:system-ui,sans-serif;max-width:32rem;margin:2rem auto;padding:0 1rem;line-height:1.5;color:var(--fg)}
        h1{font-size:1.35rem}
        label{display:block;margin:.75rem 0 .2rem;font-size:.9rem}
        input{width:100%;box-sizing:border-box;padding:.45rem .5rem;font-size:1rem}
        button{font-size:1rem;padding:.55rem 1rem;margin:.5rem .5rem 0 0;cursor:pointer}
        .muted{color:var(--muted);font-size:.9rem}
        .err{color:var(--err)}
        .ok{color:var(--ok)}
        .box{background:var(--bg);padding:1rem;border-radius:6px;margin:1rem 0}
        #waiting[hidden],#invite[hidden],#request[hidden],#intro[hidden]{display:none!important}
        body.join-waiting #intro,body.join-waiting #request{display:none!important}
        .wait-panel{text-align:center;padding:2.5rem 1.25rem;margin:2rem auto;max-width:24rem;background:var(--bg);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
        .wait-panel .loader{width:3rem;height:3rem;margin:0 auto 1.25rem;border:4px solid #ddd;border-top-color:#0dbd8b;border-radius:50%;animation:sp .85s linear infinite}
        .wait-panel h2{font-size:1.2rem;margin:0 0 .5rem;font-weight:600}
        .wait-panel .wait-lead{font-size:1rem;margin:0 0 .75rem;color:var(--fg)}
        .wait-tick{font-size:.85rem;color:var(--muted);margin-top:1rem;min-height:1.25rem}
        button:disabled{opacity:.6;cursor:not-allowed}
        .client-intro{margin:1rem 0 .5rem;font-size:.9rem}
        .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem;margin:.75rem 0 1.25rem}
        .client-card{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.65rem .4rem;border:1px solid #ddd;border-radius:8px;background:#fff;color:inherit;text-decoration:none;font-size:.8rem;text-align:center;transition:border-color .15s,box-shadow .15s}
        .client-card:hover{border-color:#888;box-shadow:0 1px 4px rgba(0,0,0,.08)}
        .client-card.recommended{border-color:#0dbd8b;box-shadow:0 0 0 1px #0dbd8b}
        .client-card.recommended .get{color:#0a9a72;font-weight:600}
        .client-card img{width:2.25rem;height:2.25rem;object-fit:contain}
        .client-card .name{font-weight:600;line-height:1.2}
        .client-card .get{color:var(--muted);font-size:.75rem}
        .connect{margin-top:1.25rem;padding-top:1rem;border-top:1px solid #ddd}
        .connect h3{font-size:1rem;margin:0 0 .35rem}
        .btn-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.65rem}
        a.btn{display:inline-block;padding:.55rem .85rem;border-radius:6px;font-size:.9rem;font-weight:600;text-decoration:none;border:1px solid #ccc;background:#fff;color:var(--fg)}
        a.btn:hover{border-color:#666}
        a.btn.primary{background:#0dbd8b;border-color:#0a9a72;color:#fff}
        a.btn.primary:hover{background:#0aa87a}
        .mxid{font-weight:600}
        .token{font-family:monospace;word-break:break-all;width:100%;padding:.5rem;font-size:.95rem}
        .spin{display:inline-block;width:1rem;height:1rem;border:2px solid #ccc;border-top-color:#333;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:.35rem}
        @keyframes sp{to{transform:rotate(360deg)}}
        .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
      </style>
    </head>
    <body>
      <div id="intro">
        <h1>Register on chat.sax.lgbt</h1>
        <p class="muted">Registration on <strong>chat.sax.lgbt</strong> is token-only. Open the invite link you were sent on <strong>links.sax.lgbt</strong> (it redirects here); each request is approved manually before a token is issued.</p>
      </div>

      <div id="request">
        <h2>Request a token</h2>
        <p class="muted">Choose a username (letters, numbers, <code>.</code> <code>_</code> <code>=</code> <code>-</code> <code>/</code> only). This page shows the token once the request is approved.</p>
        <p class="muted">Matrix ID: <span class="mxid" id="mxid-preview">@…:chat.sax.lgbt</span></p>
        <form id="req-form" novalidate>
          <label>Username</label>
          <input name="username" id="req-user" required pattern="[a-z0-9._=/-]+" autocomplete="username">
          <label>Email <span class="muted">(optional)</span></label>
          <input name="email" id="req-email" type="email" autocomplete="email">
          <label>Display name <span class="muted">(optional)</span></label>
          <input name="display_name" autocomplete="name">
          <label class="hp" aria-hidden="true"><input type="text" name="_hp" tabindex="-1" autocomplete="off"></label>
          <p id="form-err" class="err" hidden></p>
          <button type="submit" id="req-submit">Send request</button>
        </form>
      </div>

      <div id="waiting" hidden class="wait-panel" aria-live="polite" aria-busy="true" role="status" data-rid="">
        <div class="loader" aria-hidden="true"></div>
        <h2 id="waiting-title">Waiting for approval</h2>
        <p class="wait-lead" id="waiting-lead"></p>
        <p id="waiting-hint" class="muted"></p>
        <p class="wait-tick" id="waiting-tick"></p>
      </div>

      <div id="invite" hidden class="box">
        <p id="invite-mxid" class="mxid"></p>
        <label>Registration token</label>
        <input class="token" id="invite-token" readonly>
        <button type="button" id="copy-token">Copy token</button>
        <p class="client-intro muted"><strong>FluffyChat</strong> is what we recommend: install from the link below, sign up with homeserver <code>https://chat.sax.lgbt</code>, use the username above, and paste this token when the app asks for a registration token.</p>
        <div class="client-grid" role="list">
          <a class="client-card recommended" role="listitem" href="https://fluffychat.im" target="_blank" rel="noopener noreferrer">
            <img src="https://gitlab.com/famedly/fluffychat/-/raw/main/assets/logo.png" width="36" height="36" alt="">
            <span class="name">FluffyChat</span>
            <span class="get">Recommended</span>
          </a>
          <a class="client-card" role="listitem" href="https://element.io/download" target="_blank" rel="noopener noreferrer">
            <img src="https://element.io/assets-32bb636196f91ed59d7a49190e26b42c/5ef25c0d30ee3108da4c25e9/5f365d3197194f8c73b00112_logo-mark-primary.svg" width="36" height="36" alt="">
            <span class="name">Element</span>
            <span class="get">Alternative</span>
          </a>
          <a class="client-card" role="listitem" href="https://schildi.chat/" target="_blank" rel="noopener noreferrer">
            <img src="https://avatars.githubusercontent.com/u/73706786?v=4" width="36" height="36" alt="">
            <span class="name">SchildiChat</span>
            <span class="get">Get app</span>
          </a>
          <a class="client-card" role="listitem" href="https://cinny.in/" target="_blank" rel="noopener noreferrer">
            <img src="https://cinny.in/assets/favicon-48x48.png" width="36" height="36" alt="">
            <span class="name">Cinny</span>
            <span class="get">Web app</span>
          </a>
          <a class="client-card" role="listitem" href="https://nheko-reborn.github.io/" target="_blank" rel="noopener noreferrer">
            <img src="https://avatars.githubusercontent.com/u/46657606?v=4" width="36" height="36" alt="">
            <span class="name">Nheko</span>
            <span class="get">Desktop</span>
          </a>
          <a class="client-card" role="listitem" href="https://matrix.org/ecosystem/clients/" target="_blank" rel="noopener noreferrer">
            <img src="https://matrix.org/images/matrix-logo.svg" width="36" height="36" alt="">
            <span class="name">More clients</span>
            <span class="get">matrix.org</span>
          </a>
        </div>
        <p class="muted">Homeserver URL: <code id="hs-url">https://chat.sax.lgbt</code>. Use the same username you requested. The client must collect an email address during signup.</p>
        <section class="connect" aria-labelledby="connect-heading">
          <h3 id="connect-heading">Get FluffyChat</h3>
          <p class="muted">Desktop and mobile builds from the official site; then register against this homeserver with your token.</p>
          <div class="btn-row">
            <a class="btn primary" id="open-fluffychat" href="https://fluffychat.im" rel="noopener noreferrer">FluffyChat (download)</a>
            <a class="btn" id="open-element-alt" href="https://element.io/download" rel="noopener noreferrer">Element (alternative)</a>
          </div>
        </section>
      </div>

      <script>
    (function () {
      var HS = "https://chat.sax.lgbt";
      var params = new URLSearchParams(location.search);
      var reqUser = document.getElementById("req-user");
      var reqForm = document.getElementById("req-form");
      var reqSubmit = document.getElementById("req-submit");
      var formErr = document.getElementById("form-err");
      var preview = document.getElementById("mxid-preview");
      var waitingEl = document.getElementById("waiting");
      var pollTimer = null;
      /** @type {{ rid: string, wsig: string, gen: number } | null} */
      var pollSession = null;
      var SS_KEY = "matrix_join_wait_v1";

      function stopPolling() {
        if (pollTimer) {
          clearTimeout(pollTimer);
          pollTimer = null;
        }
        pollSession = null;
      }

      function saveWaitSession(rid, wsig, hasEmail) {
        try {
          sessionStorage.setItem(SS_KEY, JSON.stringify({ rid: rid, wsig: wsig, mail: !!hasEmail }));
        } catch (e) {}
      }

      function clearWaitSession() {
        try {
          sessionStorage.removeItem(SS_KEY);
        } catch (e) {}
      }

      function sessionMatches(rid, wsig) {
        return pollSession && pollSession.rid === rid && pollSession.wsig === wsig;
      }

      function responseMatchesSession(d, rid) {
        return d && (!d.rid || d.rid === rid);
      }

      function updPreview() {
        var u = (reqUser.value || "…").toLowerCase().replace(/[^a-z0-9._=\/-]/g, "");
        preview.textContent = "@" + (u || "…") + ":chat.sax.lgbt";
      }
      reqUser.addEventListener("input", updPreview);
      updPreview();

      function showInvite(token, user, server) {
        setWaitingMode(false);
        document.getElementById("intro").hidden = true;
        document.getElementById("request").hidden = true;
        document.getElementById("waiting").hidden = true;
        document.getElementById("invite").hidden = false;
        document.getElementById("invite-token").value = token;
        document.getElementById("invite-mxid").textContent = "@" + user + ":" + (server || "chat.sax.lgbt");
        document.getElementById("hs-url").textContent = HS;
        document.getElementById("copy-token").onclick = function () {
          navigator.clipboard.writeText(token);
        };
      }

      function waitingHint(hasEmail) {
        if (hasEmail) {
          return "You added an email. You do not need to keep this tab open — after approval, the token and join link go to that address (check spam). If you leave this page open, the token will also show up here.";
        }
        return "Keep this tab open. When your request is approved, your registration token will appear on this page automatically.";
      }

      function setWaitingMode(on) {
        if (on) {
          document.body.classList.add("join-waiting");
        } else {
          document.body.classList.remove("join-waiting");
        }
      }

      function showSending() {
        setWaitingMode(true);
        document.getElementById("intro").hidden = true;
        document.getElementById("request").hidden = true;
        document.getElementById("invite").hidden = true;
        waitingEl.hidden = false;
        waitingEl.dataset.rid = "";
        document.getElementById("waiting-title").textContent = "Sending request…";
        document.getElementById("waiting-lead").textContent = "Please wait.";
        document.getElementById("waiting-hint").textContent = "";
        document.getElementById("waiting-tick").textContent = "";
      }

      function showWaiting(rid, hasEmail) {
        setWaitingMode(true);
        document.getElementById("intro").hidden = true;
        document.getElementById("request").hidden = true;
        document.getElementById("invite").hidden = true;
        waitingEl.hidden = false;
        waitingEl.dataset.rid = rid;
        document.getElementById("waiting-title").textContent = "Waiting for approval";
        document.getElementById("waiting-lead").textContent =
          "Your request was sent. An admin will review it before a registration token is issued.";
        document.getElementById("waiting-hint").textContent = waitingHint(hasEmail);
        document.getElementById("waiting-tick").textContent = "Checking for approval…";
      }

      function resetToForm() {
        stopPolling();
        clearWaitSession();
        setWaitingMode(false);
        waitingEl.hidden = true;
        waitingEl.dataset.rid = "";
        document.getElementById("intro").hidden = false;
        document.getElementById("request").hidden = false;
      }

      function showFormError(msg) {
        formErr.textContent = msg;
        formErr.hidden = false;
        reqSubmit.disabled = false;
        reqSubmit.textContent = "Send request";
      }

      function startPolling(rid, wsig, hasEmail) {
        stopPolling();
        var gen = Date.now();
        pollSession = { rid: rid, wsig: wsig, gen: gen };
        saveWaitSession(rid, wsig, hasEmail);
        showWaiting(rid, hasEmail);
        function poll() {
          if (!sessionMatches(rid, wsig) || pollSession.gen !== gen) {
            return;
          }
          fetch("/matrix/request/status?rid=" + encodeURIComponent(rid) + "&wsig=" + encodeURIComponent(wsig), {
            credentials: "same-origin",
            headers: { Accept: "application/json" }
          })
            .then(function (r) {
              if (!sessionMatches(rid, wsig) || pollSession.gen !== gen) {
                return null;
              }
              if (!r.ok) {
                throw new Error(r.status === 403 ? "This wait link is invalid or expired. Submit the form again." : "Could not check status (" + r.status + ").");
              }
              return r.json();
            })
            .then(function (d) {
              if (!d || !sessionMatches(rid, wsig) || pollSession.gen !== gen) {
                return;
              }
              if (!responseMatchesSession(d, rid)) {
                return;
              }
              if (d.status === "ready") {
                clearWaitSession();
                stopPolling();
                showInvite(d.token, d.user, d.server || d.homeserver);
                return;
              }
              if (d.status === "expired") {
                resetToForm();
                showFormError("This request expired or was lost (for example after a server restart). Please submit again.");
                return;
              }
              if (waitingEl.dataset.rid !== rid) {
                return;
              }
              var t = new Date();
              document.getElementById("waiting-tick").textContent =
                "Still waiting… last checked " + t.toLocaleTimeString() + ".";
              pollTimer = setTimeout(poll, 3000);
            })
            .catch(function (err) {
              if (!sessionMatches(rid, wsig) || pollSession.gen !== gen) {
                return;
              }
              document.getElementById("waiting-tick").textContent = err.message || "Connection problem; retrying…";
              pollTimer = setTimeout(poll, 5000);
            });
        }
        poll();
      }

      var token = params.get("token");
      var user = params.get("user");
      if (token) {
        stopPolling();
        clearWaitSession();
        showInvite(token, user || "…", "chat.sax.lgbt");
        return;
      }

      var rid = params.get("rid");
      var wsig = params.get("wsig");
      if (rid && wsig) {
        var hasMail = params.get("mail") === "1";
        try {
          var stored = JSON.parse(sessionStorage.getItem(SS_KEY) || "null");
          if (stored && stored.rid && stored.rid !== rid) {
            clearWaitSession();
          } else if (stored && stored.rid === rid && stored.mail) {
            hasMail = true;
          }
        } catch (e) {}
        startPolling(rid, wsig, hasMail);
        reqForm.addEventListener("submit", function (e) {
          e.preventDefault();
        });
        return;
      }
      clearWaitSession();

      reqForm.addEventListener("submit", function (e) {
        e.preventDefault();
        formErr.hidden = true;
        stopPolling();
        clearWaitSession();
        var hasEmail = document.getElementById("req-email").value.trim() !== "";
        var user = (reqUser.value || "").trim().toLowerCase();
        if (!user) {
          showFormError("Username is required.");
          return;
        }
        var body = new URLSearchParams();
        body.set("username", user);
        body.set("email", document.getElementById("req-email").value.trim());
        body.set("display_name", (reqForm.querySelector("[name=display_name]") || {}).value || "");
        showSending();
        reqSubmit.disabled = true;
        reqSubmit.textContent = "Sending…";
        fetch("/matrix/request", {
          method: "POST",
          body: body,
          credentials: "same-origin",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            "X-Requested-With": "fetch"
          }
        })
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (t) {
                throw new Error(t && t.length < 200 ? t : "Request failed (" + res.status + ").");
              });
            }
            return res.json();
          })
          .then(function (d) {
            var rid = d.rid;
            var wsig = d.wsig;
            if (!rid || !wsig) {
              throw new Error("Unexpected response from server.");
            }
            var q = "rid=" + encodeURIComponent(rid) + "&wsig=" + encodeURIComponent(wsig);
            if (d.mail === "1") {
              q += "&mail=1";
            }
            history.replaceState(null, "", "/join?" + q);
            startPolling(rid, wsig, hasEmail || d.mail === "1");
          })
          .catch(function (err) {
            resetToForm();
            showFormError(err.message || "Could not send request.");
          });
      });
    })();
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-join-landing
  template:
    metadata:
      labels:
        app: chat-join-landing
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: chat-join-landing
        - name: nginx-conf
          configMap:
            name: chat-join-landing
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  selector:
    app: chat-join-landing
  ports:
    - name: http
      port: 80
      targetPort: http
