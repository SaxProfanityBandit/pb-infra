apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-join-landing
  namespace: matrix
data:
  default.conf: |
    server {
      listen 80;
      location /join {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Join chat.sax.lgbt</title>
      <style>
        :root { --fg:#1a1a1a; --muted:#555; --bg:#f6f6f6; --ok:#0a6; --err:#b00; }
        body{font-family:system-ui,sans-serif;max-width:28rem;margin:2rem auto;padding:0 1rem;line-height:1.5;color:var(--fg)}
        h1{font-size:1.35rem}
        label{display:block;margin:.75rem 0 .2rem;font-size:.9rem}
        input{width:100%;box-sizing:border-box;padding:.45rem .5rem;font-size:1rem}
        button{font-size:1rem;padding:.55rem 1rem;margin:.5rem .5rem 0 0;cursor:pointer}
        .muted{color:var(--muted);font-size:.9rem}
        .err{color:var(--err)}
        .ok{color:var(--ok)}
        .box{background:var(--bg);padding:1rem;border-radius:6px;margin:1rem 0}
        #done[hidden],#form[hidden],#request[hidden],#request-sent[hidden]{display:none!important}
        .mxid{font-weight:600}
        details{margin-top:1.5rem;font-size:.9rem}
      </style>
    </head>
    <body>
      <h1>Join Matrix</h1>
      <p class="muted">Homeserver <strong>chat.sax.lgbt</strong></p>

      <p id="request-sent" hidden class="ok">Request sent — you'll get an invite link if approved.</p>

      <div id="request">
        <h2>Request access</h2>
        <p class="muted">Pick the username you want. If approved, you'll get a link to finish signup.</p>
        <p class="muted">Matrix ID: <span class="mxid" id="mxid-preview">@…:chat.sax.lgbt</span></p>
        <form action="https://approve.sax.lgbt/matrix/request" method="post">
          <label>Username</label>
          <input name="username" id="req-user" required pattern="[a-z0-9._=\\-/]+" autocomplete="username">
          <label>Email</label>
          <input name="email" type="email" required autocomplete="email">
          <label>Display name <span class="muted">(optional)</span></label>
          <input name="display_name" autocomplete="name">
          <label class="contact-form__hp" aria-hidden="true">Leave blank<input name="_hp" tabindex="-1" autocomplete="off"></label>
          <button type="submit">Submit request</button>
        </form>
      </div>

      <div id="form" hidden>
        <p>Create your account here — no app install required to start.</p>
        <form id="reg">
          <label>Username</label>
          <input name="username" required autocomplete="username" pattern="[a-z0-9._=\\-/]+" title="Lowercase letters, numbers, . _ = - /">
          <label>Password</label>
          <input name="password" type="password" required autocomplete="new-password" minlength="8">
          <label>Email <span class="muted">(required on this server)</span></label>
          <input name="email" type="email" required autocomplete="email">
          <button type="submit">Create account</button>
        </form>
        <p id="status" class="muted" role="status"></p>
      </div>

      <div id="done" hidden class="box">
        <p class="ok"><strong>Account created.</strong></p>
        <p id="mxid"></p>
        <p><a id="element-link" href="#" rel="noopener">Open Element (web)</a> — sign in with the username and password you just chose.</p>
        <p class="muted">Or install Element, FluffyChat, etc. and set server to <code>https://chat.sax.lgbt</code>.</p>
      </div>

      <details>
        <summary>Prefer a Matrix app?</summary>
        <p class="muted">There is no reliable <code>matrix://</code> link that passes a registration token into every client. Use this page, or paste the token from your invite link into the app when it asks.</p>
      </details>

      <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("requested") === "1") {
        document.getElementById("request").hidden = true;
        document.getElementById("request-sent").hidden = false;
      }
      var reqUser = document.getElementById("req-user");
      var preview = document.getElementById("mxid-preview");
      function updPreview() {
        var u = (reqUser.value || "…").toLowerCase().replace(/[^a-z0-9._=\\-/]/g, "");
        preview.textContent = "@" + (u || "…") + ":chat.sax.lgbt";
      }
      reqUser.addEventListener("input", updPreview);
      updPreview();

      var token = params.get("token");
      if (!token) return;
      document.getElementById("request").hidden = true;
      document.getElementById("request-sent").hidden = true;
      document.getElementById("form").hidden = false;
      var hint = params.get("user");
      var un = document.querySelector("#reg input[name=username]");
      if (hint && un) un.value = hint;

      var HS = location.origin;
      var registerUrl = HS + "/_matrix/client/v3/register";
      var elementBase = "https://app.element.io/#/login?hs_url=" + encodeURIComponent(HS);

      function authStage(stage, t) {
        if (stage === "m.login.dummy") return { type: "m.login.dummy" };
        if (stage === "m.login.registration_token") return { type: "m.login.registration_token", token: t };
        throw new Error("Unsupported auth stage: " + stage);
      }

      async function registerUser(username, password, email, regToken) {
        var session = null;
        var completed = [];
        var stages = [];
        for (var i = 0; i < 12; i++) {
          var body = {
            username: username,
            password: password,
            email: email,
            initial_device_display_name: "Join page"
          };
          if (session) {
            body.auth = { session: session };
            var next = null;
            for (var s = 0; s < stages.length; s++) {
              if (completed.indexOf(stages[s]) < 0) { next = stages[s]; break; }
            }
            if (next) Object.assign(body.auth, authStage(next, regToken));
          }
          var res = await fetch(registerUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          var data = await res.json().catch(function () { return {}; });
          if (res.ok) return data;
          if (res.status === 401 && data.session) {
            session = data.session;
            completed = data.completed || [];
            if (data.flows && data.flows[0] && data.flows[0].stages) stages = data.flows[0].stages;
            continue;
          }
          var msg = data.error || data.errcode || ("HTTP " + res.status);
          throw new Error(msg);
        }
        throw new Error("Registration did not complete");
      }

      document.getElementById("reg").addEventListener("submit", function (e) {
        e.preventDefault();
        var st = document.getElementById("status");
        st.textContent = "Creating account…";
        st.className = "muted";
        var fd = new FormData(e.target);
        registerUser(fd.get("username"), fd.get("password"), fd.get("email"), token)
          .then(function (data) {
            document.getElementById("form").hidden = true;
            document.getElementById("done").hidden = false;
            document.getElementById("mxid").textContent = data.user_id || "";
            document.getElementById("element-link").href = elementBase;
            st.textContent = "";
          })
          .catch(function (err) {
            st.textContent = err.message || String(err);
            st.className = "err";
          });
      });
    })();
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-join-landing
  template:
    metadata:
      labels:
        app: chat-join-landing
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: chat-join-landing
        - name: nginx-conf
          configMap:
            name: chat-join-landing
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: chat-join-landing
  namespace: matrix
spec:
  selector:
    app: chat-join-landing
  ports:
    - name: http
      port: 80
      targetPort: http
