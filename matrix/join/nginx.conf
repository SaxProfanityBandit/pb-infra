server {
  listen 80;
  location = /join/gate {
    internal;
    proxy_pass http://registration-gateway.matrix.svc.cluster.local/join/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $join_client_uri;
  }

  location = /join.css {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    root /usr/share/nginx/html;
    default_type text/css;
  }

  location = /join.js {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    root /usr/share/nginx/html;
    default_type application/javascript;
  }

  location /join {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    error_page 403 = @join_forbidden;
    error_page 502 503 = @join_gate_unavailable;
    try_files /index.html =404;
    root /usr/share/nginx/html;
  }

  location @join_forbidden {
    root /usr/share/nginx/forbidden;
    try_files /forbidden.html =403;
    internal;
  }

  location @join_gate_unavailable {
    default_type text/html;
    return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>chat.sax.lgbt</title></head><body style="font-family:system-ui;max-width:28rem;margin:2rem auto;padding:0 1rem"><h1>Registration temporarily unavailable</h1><p>The join service is starting or restarting. Wait a minute and reload, or use your Kutt invite link again.</p></body></html>';
    internal;
  }
}
