server {
  listen 80;
  location = /join/gate {
    internal;
    proxy_pass http://registration-gateway.matrix.svc.cluster.local/join/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $join_client_uri;
  }

  location = /join.css {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    root /usr/share/nginx/html;
    default_type text/css;
  }

  location = /join.js {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    root /usr/share/nginx/html;
    default_type application/javascript;
  }

  location = /join/page.json {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    proxy_pass https://cdn.sax.lgbt/public/matrix/join/join-copy.json;
    proxy_set_header Host cdn.sax.lgbt;
    proxy_ssl_server_name on;
    default_type application/json;
  }

  location /join {
    set $join_client_uri $request_uri;
    auth_request /join/gate;
    error_page 403 =403 @join_forbidden;
    error_page 502 503 = @join_gate_unavailable;
    try_files /index.html =404;
    root /usr/share/nginx/html;
  }

  location @join_forbidden {
    internal;
    root /usr/share/nginx/forbidden;
    try_files /forbidden.html =403;
  }

  location @join_gate_unavailable {
    default_type text/html;
    return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>chat.sax.lgbt</title></head><body style="font-family:system-ui;max-width:28rem;margin:2rem auto;padding:0 1rem"><h1>Join page is down for a moment</h1><p>Gateway or landing pod is restarting. Wait a minute and reload, or open your links.sax.lgbt invite again.</p></body></html>';
    internal;
  }
}
