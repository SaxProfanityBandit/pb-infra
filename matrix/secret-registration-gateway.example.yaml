apiVersion: v1
kind: Secret
metadata:
  name: registration-gateway
  namespace: matrix
type: Opaque
stringData:
  link_signing_key: replace-with-random-signing-key
  synapse_admin_access_token: syt_REPLACE_WITH_ADMIN_TOKEN
  smtp_user: sax
  smtp_password: replace-with-stalwart-app-password
  hookshot_webhook_internal_url: http://hookshot.matrix.svc.cluster.local:9000/webhook/replace-with-your-token
  # Same Kutt API key as site (Admin → Settings → API). Required for /join Kutt gate.
  kutt_api_key: replace-with-kutt-api-key
