apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg
  namespace: matrix
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: postgresql
      version: "16.7.24"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: matrix
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      tag: latest
    architecture: standalone
    auth:
      username: synapse
      database: synapse
      existingSecret: synapse-db
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      initdb:
        args: "--lc-collate=C --lc-ctype=C"
      persistence:
        enabled: true
        size: 10Gi
        storageClass: rook-ceph
