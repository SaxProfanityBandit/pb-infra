# Optional: Synapse outbound SMTP (email verification on signup).
# Copy to matrix/secret-synapse-email.yaml, set smtp_pass, kubectl apply -n matrix.
# Create matching Stalwart app password for localpart "synapse" (or change smtp_user in release.yml).
#
# Flux merges this into HelmRelease values (extraSecrets + verify_emails).
apiVersion: v1
kind: Secret
metadata:
  name: synapse-email
  namespace: matrix
type: Opaque
stringData:
  values.yaml: |
    extraSecrets:
      email:
        smtp_pass: REPLACE_STALWART_SYNAPSE_SMTP_PASSWORD
    extraConfig:
      verify_emails: true
