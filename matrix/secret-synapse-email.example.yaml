apiVersion: v1
kind: Secret
metadata:
  name: synapse-email
  namespace: matrix
type: Opaque
stringData:
  values.yaml: |
    extraSecrets:
      email:
        smtp_pass: REPLACE_STALWART_SAX_SMTP_APP_PASSWORD
        smtp_host: mail.sax.lgbt
        smtp_port: 587
        smtp_user: sax
        require_transport_security: true
        notif_from: "Sax Chat <me@sax.lgbt>"
        enable_notifs: false
