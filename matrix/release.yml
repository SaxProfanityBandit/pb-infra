apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synapse
  namespace: matrix
spec:
  interval: 5m
  timeout: 20m
  dependsOn:
    - name: pg
      namespace: matrix
  chart:
    spec:
      chart: matrix-synapse
      version: "3.12.41"
      sourceRef:
        kind: HelmRepository
        name: ananace
        namespace: matrix
  valuesFrom:
    - kind: Secret
      name: synapse-email
      optional: true
      valuesKey: values.yaml
  values:
    serverName: chat.sax.lgbt
    publicServerName: chat.sax.lgbt
    config:
      publicBaseurl: https://chat.sax.lgbt/
      reportStats: false
      enableRegistration: true
      trustedKeyServers:
        - server_name: matrix.org
    signingkey:
      job:
        enabled: true
    postgresql:
      enabled: false
    externalPostgresql:
      host: pg-postgresql.matrix.svc.cluster.local
      port: 5432
      username: synapse
      database: synapse
      existingSecret: synapse-db
      existingSecretPasswordKey: password
    redis:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 150m
          memory: 256Mi
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: rook-ceph
    ingress:
      enabled: false
    wellknown:
      enabled: true
      client:
        m.homeserver:
          base_url: https://chat.sax.lgbt
      server:
        m.server: chat.sax.lgbt:443
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    extraConfig:
      auto_join_rooms:
        - "!YnB3A2SZgqQMlIejEr8xHhxxhMC-3vBJm0Ch7ve_YmY"
      modules:
        - module: coven_room_create_policy.CovenRoomCreatePolicy
          config:
            allowed_localparts:
              - sax
      registration_requires_token: true
      registrations_require_3pid:
        - email
      verify_emails: false
      email:
        smtp_host: stalwart-mailserver.mailserver.svc.cluster.local
        smtp_port: 587
        smtp_user: synapse
        require_transport_security: true
        notif_from: "Sax Chat <noreply@chat.sax.lgbt>"
        enable_notifs: false
      app_service_config_files:
        - /synapse/config/conf.d/hookshot-registration.yaml
      experimental_features:
        msc3202_transaction_extensions: true
        msc2409_to_device_messages_enabled: true
        msc3983_appservice_otk_claims: true
        msc3984_appservice_key_query: true
    synapse:
      extraEnv:
        - name: PYTHONPATH
          value: /synapse/local_modules
      extraVolumes:
        - name: hookshot-appservice
          secret:
            secretName: hookshot-appservice
            optional: true
        - name: coven-room-create-module
          configMap:
            name: synapse-coven-room-create-module
      extraVolumeMounts:
        - name: hookshot-appservice
          mountPath: /synapse/config/conf.d/hookshot-registration.yaml
          subPath: registration.yaml
          readOnly: true
        - name: coven-room-create-module
          mountPath: /synapse/local_modules
          readOnly: true
      strategy:
        type: Recreate
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
