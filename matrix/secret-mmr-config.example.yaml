apiVersion: v1
kind: Secret
metadata:
  name: mmr-config
  namespace: matrix
type: Opaque
stringData:
  values.yaml: |
    externalPostgresql:
      password: REPLACE_MMR_DB_PASSWORD
      sslMode: disable
    config:
      admins:
        - "@REPLACE_ADMIN_MXID"
      datastores:
        - type: s3
          id: saxstackmedia
          forKinds:
            - thumbnails
            - remote_media
            - local_media
            - archives
          opts:
            tempPath: /tmp/mediarepo_s3_upload
            endpoint: rgw.ctrl-c.liu.se
            region: us-east-1
            accessKeyId: REPLACE_AWS_ACCESS_KEY_ID
            accessSecret: REPLACE_AWS_SECRET_ACCESS_KEY
            ssl: "false"
            multipartUploads: "false"
            redirectWhenCached: "true"
            storageClass: STANDARD
            bucketName: sax-stack-media
            publicBaseUrl: https://cdn.sax.lgbt/matrix/
