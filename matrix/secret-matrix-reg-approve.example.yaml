# Synapse admin token for approve.sax.lgbt (registration tokens).
# Element → All settings → Help & About → Advanced → Access token (@sax admin).
#
# Handler pod is still site-gateway in rickardsahlgren; secret must exist there.
# kubectl apply -f matrix/secret-matrix-reg-approve.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-reg-approve
  namespace: rickardsahlgren
type: Opaque
stringData:
  synapse_admin_access_token: syt_REPLACE_WITH_ADMIN_TOKEN
