apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: matrix
configMapGenerator:
  - name: synapse-coven-room-create-module
    files:
      - coven_room_create_policy.py
    options:
      disableNameSuffixHash: true
  - name: chat-join-landing-wiring
    files:
      - join/nginx.conf
      - index.html=join/index-shell.html
      - join/join.js
      - join/join.css
    options:
      disableNameSuffixHash: true
resources:
  - namespace.yml
  - repository.yml
  - hookshot-repository.yml
  - postgresql-release.yml
  - release.yml
  - mmr-release.yml
  - ingress-chat-sax.yml
  - hookshot-release.yml
  - hookshot-crypto-pvc.yml
  - hookshot-queue-redis.yml
  - ingress-hooks-sax.yml
  - ingress-approve-sax.yml
  - registration-gateway.yml
  - join-landing.yml
